[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = '''
G.FUNCS.discard_cards_from_highlighted = function(e, hook)
'''
position = 'after'
payload = '''
    if G.GAME.blind.name == 'bl_balacraft_drowned' and not G.GAME.blind.disabled then
        PB_UTIL.drowned_effect(e, hook)
        return
    end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = '''
if G.GAME.modifiers.discard_cost then
    ease_dollars(-G.GAME.modifiers.discard_cost)
end
ease_discard(-1)
'''
position = 'after'
payload = '''
    if G.GAME.blind.name == 'bl_balacraft_husk' and not G.GAME.blind.disabled then
        ease_dollars(-2)
    end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'functions/button_callbacks.lua'
pattern = 'G.GAME.skips = (G.GAME.skips or 0) + 1'
position = 'after'
match_indent = true
payload = '''
G.GAME.skipped_blinds_this_ante = G.GAME.skipped_blinds_this_ante + 1
if PB_UTIL and PB_UTIL.hunger_on_skip then PB_UTIL.hunger_on_skip() end
'''

[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = '''pack_size = 2,
        skips = 0,'''
position = 'after'
match_indent = true
payload = '''
skipped_blinds_this_ante = 0,
'''

[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = 'G.GAME.round_resets.ante = G.GAME.round_resets.ante + mod'
position = 'after'
match_indent = true
payload = '''
    G.GAME.skipped_blinds_this_ante = 0
'''

# Sword tool consumable: apply the per-blind buff to the FINAL hand mult, just after the deck's
# final_scoring_step (functions/state_events.lua:800, a unique anchor). Uses mod_mult so the
# change is synced into SMODS.Scoring_Parameters (the value the score reads), not just the local.
# Two flavors (mutually exclusive per blind -- only one sword can be used per blind):
#   * sword_xmult (lower tiers): flat   mult = mult * x
#   * sword_exp   (diamond/netherite): exponent  mult = mult ^ e   (Talisman overloads ^ for big
#     numbers, mirroring its own e_mult idiom, so this is overflow-safe at ante 12+ scores).
# Both are set in the consumable's use() and reset each blind by reset_game_globals (resources.lua).
[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = 'mult = mod_mult(nu_mult or mult)'
position = 'after'
match_indent = true
payload = '''
if G.GAME.balacraft then
    local _bc = G.GAME.balacraft
    local _x = _bc.sword_xmult and _bc.sword_xmult ~= 1
    local _e = _bc.sword_exp and _bc.sword_exp ~= 1
    if _x then mult = mod_mult(mult * _bc.sword_xmult) end
    if _e then mult = mod_mult(mult ^ _bc.sword_exp) end
    if (_x or _e) and PB_UTIL and PB_UTIL.sword_score_message then
        -- Juice it like a joker: queue the "Xn Mult" / "^n Mult" pop (PB_UTIL.sword_score_message,
        -- utilities/resources.lua). Guarded so the math above still works if that file is absent.
        PB_UTIL.sword_score_message()
    end
end
'''

# Axe tool consumable (WEAPON mode): a HYBRID buff -- a flat +Chips AND an xMult this blind, applied
# together. Anchored just after hand_chips is finalized (hand_chips = mod_chips(nu_chip or hand_chips))
# so BOTH hand_chips and mult are in scope; uses mod_chips/mod_mult so the changes sync into
# SMODS.Scoring_Parameters (the values the score reads). Set in the Axe's use() (no wood selected) and
# reset each blind by reset_game_globals (resources.lua). Only one axe can be used per blind.
[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = 'hand_chips = mod_chips(nu_chip or hand_chips)'
position = 'after'
match_indent = true
payload = '''
if G.GAME.balacraft then
    local _bc = G.GAME.balacraft
    local _c = _bc.axe_chips and _bc.axe_chips ~= 0
    local _x = _bc.axe_xmult and _bc.axe_xmult ~= 1
    if _c then hand_chips = mod_chips(hand_chips + _bc.axe_chips) end
    if _x then mult = mod_mult(mult * _bc.axe_xmult) end
    if (_c or _x) and PB_UTIL and PB_UTIL.axe_score_message then
        PB_UTIL.axe_score_message()
    end
end
'''

# Potion of Strength: a PARTIAL Plasma -- pull this blind's hand_chips and mult `strength_pct` of
# the way toward their average (0.10 base, 0.20 with Glowstone). Same anchor as the Axe (both
# hand_chips and mult in scope; mod_chips/mod_mult sync into SMODS.Scoring_Parameters). The formula
# mirrors AllinJest's calculate_balance_percent_values. strength_pct is set in the potion's use()
# (utilities/potions.lua) and cleared when the effect expires (Blind:set_blind wrap there).
[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = 'hand_chips = mod_chips(nu_chip or hand_chips)'
position = 'after'
match_indent = true
payload = '''
if G.GAME.balacraft and G.GAME.balacraft.strength_pct and G.GAME.balacraft.strength_pct ~= 0 then
    local _p = G.GAME.balacraft.strength_pct
    local _cm = _p * hand_chips
    local _mm = _p * mult
    local _avg = (_cm + _mm) / 2
    hand_chips = mod_chips(hand_chips + (_avg - _cm))
    mult = mod_mult(mult + (_avg - _mm))
    if PB_UTIL and PB_UTIL.strength_score_message then PB_UTIL.strength_score_message() end
end
'''